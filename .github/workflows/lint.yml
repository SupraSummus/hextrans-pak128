name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./check_changelog.sh pak128.prototype/doc/changelog.txt

  rebake-constant:
    # Minutes per run with every family baked: on main only, a PR rebakes
    # the scenes it touches by hand.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # One BLAS kernel whatever CPU the runner has, so a baker that
      # depends on it fails on every run, not on some runners.
      OPENBLAS_CORETYPE: Prescott
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pinned, so a new release does not change the bytes under main.
      - run: pip install numpy==2.5.4 Pillow==12.3.0
      - name: Re-run parametric + bespoke bakers
        run: python3 -m tools.bake_all
      - name: Verify byte-identical output
        run: git diff --exit-code -- landscape/grounds/ infrastructure/ special_buildings/ factories/
