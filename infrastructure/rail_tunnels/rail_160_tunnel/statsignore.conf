This file tells copyright/stats processing scripts not to look here.

This directory holds the 3D model for rail_160_tunnel
(`scene.py`, parameters in `infrastructure/tunnel_params.py`)
and the legacy upstream art it was measured from, in `src/`.
The pakset asset, baked by the model, is rail_160_tunnel.{png,dat}
in the parent directory.  This directory contains no pakset assets.

Only this file name is important.
